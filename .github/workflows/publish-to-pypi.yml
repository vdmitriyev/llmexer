name: Publish Python 🐍 package distribution 📦 to PyPI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:


jobs:

  build:
    name: Build distribution 📦
    uses: ./.github/workflows/build.yml

  publish-to-testpypi:
    name: Publish Python 🐍 package distribution 📦 to TestPyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish on tag pushes
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/llmexer

    permissions:
      id-token: write  # mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4.1.7
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - publish-to-testpypi  # Runs ONLY if testpypi publish succeeds
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/llmexer

    permissions:
      id-token: write  # mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4.1.7
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Upload Python 🐍 package distribution to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all the dists
      uses: actions/download-artifact@v4.1.7
      with:
        name: python-package-distributions
        path: dist/

    - name: Extract Release Notes from HISTORY.rst
      id: extract-changelog
      run: |
        python -c '
        import re, os

        tag = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")

        with open("HISTORY.rst", "r", encoding="utf-8") as f:
            content = f.read()

        pattern = r"^(?P<header>" + re.escape(tag) + r"\s*\(.*?\))\n[-=]+\n\n(?P<notes>.*?)(?=\n\n[^\n]+\n[-=]+\n|\Z)"
        match = re.search(pattern, content, re.DOTALL | re.MULTILINE)

        if not match:
            pattern = r"^(?P<header>\d+\.\d+\.\d+.*?)\n[-=]+\n\n(?P<notes>.*?)(?=\n\n[^\n]+\n[-=]+\n|\Z)"
            match = re.search(pattern, content, re.DOTALL | re.MULTILINE)

        notes = match.group("notes").strip() if match else "Release details available in HISTORY.rst."

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"notes<<EOF\n{notes}\nEOF\n")
        '

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        NOTES: ${{ steps.extract-changelog.outputs.notes }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --notes "$NOTES"

    - name: Upload artifact to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'
