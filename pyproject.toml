[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmexer"
description = "Framework and CLI utility to create and curate datasets (e.g., publications, metadata, LLM prompts, etc.) and orchestrate (design, run, evaluate) various LLM experiments on them"
version = "0.3.2"
readme = "README.md"
authors = [
  {name = "vdmitriyev"},
  {name = "ellariel"}
]
maintainers = [
  {name = "vdmitriyev"}
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "Jinja2>=3.1.6",
    "typing-extensions>=4.0.0",
    "pandas>=3.0.1",
    "requests>=2.33.0",
    "pypdf>=6.10.2",
    "langdetect>=1.0.9",
    "pydantic>=2.12.5",
    "openai>=2.30.0",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0.36",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
license = "MIT"

[project.scripts]
llmexer = "llmexer.cli:app"

[project.urls]

homepage = "https://github.com/vdmitriyev/llmexer"
changelog = "https://github.com/vdmitriyev/llmexer/blob/main/HISTORY.rst"
repository = "https://github.com/vdmitriyev/llmexer.git"
documentation = "https://vdmitriyev.github.io/llmexer/"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmexer*"]

[tool.setuptools.package-data]
llmexer = ["data/*.j2"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pre-commit>=4.5.1",
    "bandit>=1.9.4",
    "pylint>=4.0.5",
    "pytest>=9.0.3"
]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.uv]
exclude-newer = "8 days"
